# Ally Accessibility Audit — Azure DevOps pipeline example
#
# Runs a read-only `/ally feedback` audit against the XAML files changed in a
# pull request, then posts the findings as a PR comment thread.
#
# Prerequisites:
#   1. Enable "Allow scripts to access the OAuth token" on this pipeline
#      (Edit pipeline > ... > Triggers > this pipeline > Allow scripts to
#      access the OAuth token), or set it inline below with a checkout step.
#   2. Grant the "<Project> Build Service" identity the "Contribute to pull
#      requests" permission on the repo — Repos > Security — or the comment
#      step will fail with a 403.
#   3. Create a secret pipeline variable named COPILOT_GITHUB_TOKEN containing
#      a GitHub PAT with the "Copilot Requests" permission. Copilot billing is
#      always GitHub-side, so this is required regardless of CI host.
#   4. Copy .github/agents/ally.md and .allyconfig.json from the
#      ally-maui-accessibility-agent repo into this repo, at the same paths.

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  xamlGlob: "**/*.xaml"

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true

  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: "Use Node.js 20"

  - script: npm install -g @github/copilot
    displayName: "Install GitHub Copilot CLI"

  - script: |
      set -e
      git fetch origin "$(System.PullRequest.TargetBranch)" --depth=1
      TARGET_REF="origin/$(echo $(System.PullRequest.TargetBranch) | sed 's#refs/heads/##')"
      CHANGED=$(git diff --name-only --diff-filter=ACMR "$TARGET_REF...HEAD" -- "$(xamlGlob)")

      if [ -z "$CHANGED" ]; then
        echo "##vso[task.setvariable variable=hasChanges]false"
      else
        echo "##vso[task.setvariable variable=hasChanges]true"
      fi
      echo "$CHANGED" > changed-files.txt
      cat changed-files.txt
    displayName: "Find changed XAML files"

  - script: |
      set -e
      {
        echo "Load the agent at .github/agents/ally.md and run /ally feedback."
        echo "Restrict the audit to only the changed files listed below. Respect"
        echo ".allyconfig.json only after confirming it exists at the repo root;"
        echo "if it is missing, stop and report that the audit was skipped. Do"
        echo "not write or modify any files. Output the full findings report as"
        echo "Markdown."
        echo ""
        echo "Changed files:"
        cat changed-files.txt
      } > ally-prompt.txt

      copilot -p "$(cat ally-prompt.txt)" --allow-tool search/codebase > ally-report.md
      cat ally-report.md
    displayName: "Run Ally feedback"
    condition: eq(variables.hasChanges, 'true')
    env:
      GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)

  - script: |
      set -e
      REPORT_JSON=$(python3 -c "import json; print(json.dumps(open('ally-report.md').read()))")
      BODY=$(printf '{"comments":[{"parentCommentId":0,"content":%s,"commentType":1}],"status":1}' "$REPORT_JSON")

      curl -sS -f -u ":$SYSTEM_ACCESSTOKEN" \
        -H "Content-Type: application/json" \
        -X POST \
        --data "$BODY" \
        "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/pullRequests/$(System.PullRequest.PullRequestId)/threads?api-version=7.1"
    displayName: "Post PR comment"
    condition: eq(variables.hasChanges, 'true')
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
