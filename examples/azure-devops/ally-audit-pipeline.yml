# Ally Accessibility Audit — Azure DevOps pipeline example
#
# Runs a read-only `/ally diff` audit — scoped to changed hunks (±3 lines) in
# the XAML files changed in a pull request, not a full-repo feedback pass —
# then posts the findings as a PR comment thread.
#
# Prerequisites:
#   1. Enable "Allow scripts to access the OAuth token" on this pipeline
#      (Edit pipeline > ... > Triggers > this pipeline > Allow scripts to
#      access the OAuth token), or set it inline below with a checkout step.
#   2. Grant the "<Project> Build Service" identity the "Contribute to pull
#      requests" permission on the repo — Repos > Security — or the comment
#      step will fail with a 403.
#   3. Create a secret pipeline variable named COPILOT_GITHUB_TOKEN containing
#      a GitHub PAT with the "Copilot Requests" permission. Copilot billing is
#      always GitHub-side, so this is required regardless of CI host.
#   4. Copy .github/agents/ally.md from the ally-maui-accessibility-agent repo
#      into this repo, at the same path. .allyconfig.json isn't something to
#      copy — it's project-specific. Run /ally config in this repo (if it
#      hasn't been already) to generate and commit one.
#
# Base branch resolution: diffs against .allyconfig.json's defaultBaseBranch
# when set, falling back to the PR's actual target branch otherwise. Read
# from the PR's target branch via `git show`, never the PR's own working
# tree, so a PR can't point defaultBaseBranch at a ref that already contains
# its own changes to make the diff disappear.
#
# If this repo's PRs sometimes target a branch other than defaultBaseBranch
# (e.g. a release branch), the diff is still taken against defaultBaseBranch
# — keep it in sync, or leave it unset to always follow the PR's real target.

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  xamlGlob: "**/*.xaml"
  copilotCliVersion: "1.0.83"

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true

  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: "Use Node.js 20"

  # Keep this version aligned with .github/workflows/ally-audit.yml.
  - script: npm install -g @github/copilot@$(copilotCliVersion)
    displayName: "Install GitHub Copilot CLI"

  - script: |
      set -e
      TRUSTED_BRANCH_NAME="${TARGET_BRANCH#refs/heads/}"
      # No --depth: a shallow fetch here can't be undone by a later plain
      # re-fetch, and would break the merge-base diff below.
      git fetch origin "$TRUSTED_BRANCH_NAME"
      CONFIG_BASE=$(git show "origin/$TRUSTED_BRANCH_NAME:.allyconfig.json" 2>/dev/null | python3 -c "import json, sys; raw = sys.stdin.read(); d = json.loads(raw) if raw.strip() else {}; print((d or {}).get('defaultBaseBranch') or '')" 2>/dev/null || true)
      if [ -n "$CONFIG_BASE" ]; then
        CONFIG_BASE="${CONFIG_BASE#refs/heads/}"
        CONFIG_BASE="${CONFIG_BASE#origin/}"
        echo "Using defaultBaseBranch from .allyconfig.json: $CONFIG_BASE"
        echo "##vso[task.setvariable variable=targetBranchName]$CONFIG_BASE"
      else
        TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"
        TARGET_BRANCH="${TARGET_BRANCH#origin/}"
        echo "No defaultBaseBranch in .allyconfig.json — using this PR's actual target branch."
        echo "##vso[task.setvariable variable=targetBranchName]$TARGET_BRANCH"
      fi
    displayName: "Resolve base branch"
    env:
      TARGET_BRANCH: $(System.PullRequest.TargetBranch)

  - script: |
      set -e
      TARGET_BRANCH_NAME="${TARGET_BRANCH_NAME#refs/heads/}"
      TARGET_BRANCH_NAME="${TARGET_BRANCH_NAME#origin/}"
      git fetch origin "$TARGET_BRANCH_NAME" --depth=1
      TARGET_REF="origin/$TARGET_BRANCH_NAME"
      CHANGED=$(git diff --name-only --diff-filter=ACMR "$TARGET_REF...HEAD" -- "$XAML_GLOB")

      if [ -z "$CHANGED" ]; then
        echo "##vso[task.setvariable variable=hasChanges]false"
      else
        echo "##vso[task.setvariable variable=hasChanges]true"
      fi
      echo "$CHANGED" > changed-files.txt
      cat changed-files.txt
    displayName: "Find changed XAML files"
    env:
      TARGET_BRANCH_NAME: $(targetBranchName)
      XAML_GLOB: $(xamlGlob)

  - script: |
      set -e
      {
        echo "Load the agent at .github/agents/ally.md and run /ally diff $TARGET_REF_NAME."
        echo "The files changed relative to that base branch are attached below —"
        echo "use exactly this list as the diff scope; do not run git yourself to"
        echo "recompute it. Restrict reported findings to changed hunks (±3 lines)"
        echo "within these files, per the /ally diff command definition. Respect"
        echo ".allyconfig.json only after confirming it exists at the repo root;"
        echo "if it is missing, stop and report that the audit was skipped. Do"
        echo "not write or modify any files. Output the full findings report as"
        echo "Markdown."
        echo ""
        echo "Changed files:"
        cat changed-files.txt
      } > ally-prompt.txt

      if ! copilot -p "Load the agent at .github/agents/ally.md and run /ally diff using the attached scope file." --attachment ally-prompt.txt --allow-tool search/codebase > ally-report.md; then
        printf '%s\n' 'Ally produced no output.' > ally-report.md
      fi
      cat ally-report.md
    displayName: "Run Ally diff audit"
    condition: eq(variables.hasChanges, 'true')
    env:
      GITHUB_TOKEN: $(COPILOT_GITHUB_TOKEN)
      TARGET_REF_NAME: $(targetBranchName)

  - script: |
      set -e
      if [ -f ally-report.md ]; then
        REPORT_JSON=$(python3 -c "import json; print(json.dumps(open('ally-report.md').read()))")
      else
        REPORT_JSON=$(python3 -c "import json; print(json.dumps('Ally produced no output.'))")
      fi

      CURL_CONFIG="$(mktemp)"
      trap 'rm -f "$CURL_CONFIG"' EXIT
      {
        echo "user = \":$SYSTEM_ACCESSTOKEN\""
        echo "header = \"Content-Type: application/json\""
        echo "data = @-"
        echo "request = POST"
        echo "url = \"$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.Name)/pullRequests/$(System.PullRequest.PullRequestId)/threads?api-version=7.1\""
      } > "$CURL_CONFIG"

      BODY="{\"comments\":[{\"parentCommentId\":0,\"content\":$REPORT_JSON,\"commentType\":1}],\"status\":1}"
      printf '%s' "$BODY" | \
      curl -sS -f --config "$CURL_CONFIG"
    displayName: "Post PR comment"
    condition: eq(variables.hasChanges, 'true')
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
