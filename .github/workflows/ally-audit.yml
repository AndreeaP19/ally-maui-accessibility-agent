name: Ally Accessibility Audit

# Base branch resolution: diffs against .allyconfig.json's defaultBaseBranch
# when set, falling back to the PR's actual target branch otherwise. Read
# from the PR's target branch via `git show`, never the PR's own working
# tree, so a PR can't point defaultBaseBranch at a ref that already contains
# its own changes to make the diff disappear.
#
# If this repo's PRs sometimes target a branch other than defaultBaseBranch
# (e.g. a release branch), the diff is still taken against defaultBaseBranch
# — keep it in sync, or leave it unset to always follow the PR's real target.

on:
  workflow_call:
    inputs:
      xaml-glob:
        description: "Glob pattern (relative to repo root) for the XAML files Ally should audit."
        required: false
        type: string
        default: "**/*.xaml"
    secrets:
      copilot-token:
        description: >
          GitHub PAT with the "Copilot Requests" permission. Required unless the
          calling repo's organization allows GITHUB_TOKEN to bill Copilot CLI usage
          to the organization, in which case this can be omitted.
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  ally-audit:
    runs-on: ubuntu-latest
    env:
      COPILOT_CLI_VERSION: "1.0.83"
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base branch
        id: base
        env:
          TRUSTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # No --depth: a shallow fetch here can't be undone by a later
          # plain re-fetch, and would break the merge-base diff below.
          git fetch origin "$TRUSTED_BASE_REF"
          CONFIG_BASE=$(git show "origin/$TRUSTED_BASE_REF:.allyconfig.json" 2>/dev/null | jq -r '.defaultBaseBranch // empty' 2>/dev/null || true)
          if [ -n "$CONFIG_BASE" ]; then
            echo "Using defaultBaseBranch from .allyconfig.json (as committed on $TRUSTED_BASE_REF): $CONFIG_BASE"
            echo "base_ref=$CONFIG_BASE" >> "$GITHUB_OUTPUT"
          else
            echo "No defaultBaseBranch in .allyconfig.json — using this PR's actual target branch."
            echo "base_ref=$TRUSTED_BASE_REF" >> "$GITHUB_OUTPUT"
          fi

      - name: Find changed XAML files
        id: diff
        env:
          XAML_GLOB: ${{ inputs.xaml-glob }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          BASE_REF="${BASE_REF#refs/heads/}"
          BASE_REF="${BASE_REF#origin/}"
          # No --depth: a shallow fetch here can't be undone by a later
          # plain re-fetch, and would break the merge-base diff below.
          git fetch origin "$BASE_REF"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- "$XAML_GLOB")

          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<ALLY_DIFF_EOF"
              echo "$CHANGED"
              echo "ALLY_DIFF_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GitHub Copilot CLI
        if: steps.diff.outputs.has_changes == 'true'
        run: npm install -g @github/copilot@$COPILOT_CLI_VERSION

      - name: Run Ally diff audit
        if: steps.diff.outputs.has_changes == 'true'
        id: ally
        env:
          GITHUB_TOKEN: ${{ secrets.copilot-token || github.token }}
          ALLY_CHANGED_FILES: ${{ steps.diff.outputs.files }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          printf '%s\n' \
            "Load the agent at .github/agents/ally.md and run /ally diff ${BASE_REF}." \
            'The files changed relative to that base branch are attached below —' \
            'use exactly this list as the diff scope; do not run git yourself to' \
            'recompute it. Restrict reported findings to changed hunks (±3 lines)' \
            'within these files, per the /ally diff command definition. Respect' \
            '.allyconfig.json only after confirming it exists at the repo root;' \
            'if it is missing, stop and report that the audit was skipped. Do not' \
            'write or modify any files. Output the full findings report as' \
            'Markdown.' \
            '' \
            'Changed files:' \
            > ally-prompt.txt
          echo "$ALLY_CHANGED_FILES" >> ally-prompt.txt

          copilot -p "Load the agent at .github/agents/ally.md and run /ally diff using the attached scope file." --attachment ally-prompt.txt --allow-tool search/codebase > ally-report.md

      - name: Post PR comment
        if: steps.diff.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          ALLY_REPORT_PATH: ally-report.md
        with:
          script: |
            const fs = require('fs');
            const path = process.env.ALLY_REPORT_PATH;
            const report = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'Ally produced no output.';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🔍 Ally Accessibility Audit\n\n${report}`,
            });

      - name: No XAML changes
        if: steps.diff.outputs.has_changes != 'true'
        env:
          XAML_GLOB: ${{ inputs.xaml-glob }}
        run: echo "No files matching \"$XAML_GLOB\" changed in this PR — skipping audit."
