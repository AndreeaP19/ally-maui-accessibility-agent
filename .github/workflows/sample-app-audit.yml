name: Sample App Accessibility Audit

# Exercises the reusable Ally workflow against the sample app in this repo,
# so the CI integration itself gets validated by a real PR check on every
# change that could affect it — not just documented in examples/. Requires
# a repository secret named COPILOT_GITHUB_TOKEN (see the "Running Ally in
# CI" section of README.md).

on:
  pull_request:
    paths:
      - "examples/sample-app/**"
      - ".allyconfig.json"
      - ".github/agents/ally.md"
      - ".github/workflows/ally-audit.yml"
      - ".github/workflows/sample-app-audit.yml"

jobs:
  ally-audit:
    # A reusable workflow can't be granted more than its caller allows — this
    # job must explicitly request at least what ally-audit.yml itself needs
    # (contents: read, pull-requests: write), since a repo's default token
    # permissions (Settings > Actions > General > Workflow permissions) are
    # often read-only and would otherwise cap it down to "none" and fail
    # workflow validation before the job even starts.
    permissions:
      contents: read
      pull-requests: write
      copilot-requests: write
    uses: ./.github/workflows/ally-audit.yml
    with:
      xaml-glob: "examples/sample-app/**/*.xaml"
